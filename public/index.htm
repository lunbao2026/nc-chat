<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>nC Chat</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, 'Segoe UI', 'PingFang SC', sans-serif;
    background: #0f0f0f;
    color: #e0e0e0;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 16px 24px;
    border-bottom: 1px solid #222;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  header h1 { font-size: 18px; font-weight: 600; color: #fff; }
  header .dot { width: 8px; height: 8px; border-radius: 50%; background: #4caf50; }
  header .status { font-size: 12px; color: #666; margin-left: auto; }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    display: flex;
    flex-direction: column;
    gap: 4px;
    max-width: 70%;
  }
  .msg .name { font-size: 12px; color: #666; }
  .msg .text {
    background: #1a1a1a;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.5;
    word-break: break-word;
  }
  .msg.self { align-self: flex-end; }
  .msg.self .name { text-align: right; }
  .msg.self .text { background: #2a4a7a; }
  footer {
    padding: 16px 24px;
    border-top: 1px solid #222;
    display: flex;
    gap: 12px;
  }
  #input {
    flex: 1;
    background: #1a1a1a;
    border: none;
    border-radius: 12px;
    padding: 12px 16px;
    color: #fff;
    font-size: 14px;
    outline: none;
  }
  #input:focus { background: #222; }
  #send {
    background: #2a4a7a;
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 12px 24px;
    font-size: 14px;
    cursor: pointer;
  }
  #send:hover { background: #335a90; }
  #login {
    position: fixed;
    inset: 0;
    background: #0f0f0f;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    z-index: 10;
  }
  #login h2 { font-size: 24px; color: #fff; font-weight: 600; }
  #login input {
    background: #1a1a1a;
    border: none;
    border-radius: 12px;
    padding: 14px 20px;
    color: #fff;
    font-size: 16px;
    width: 240px;
    outline: none;
    text-align: center;
  }
  #login button {
    background: #2a4a7a;
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 14px 40px;
    font-size: 16px;
    cursor: pointer;
  }
</style>
</head>
<body>

<div id="login">
  <h2>nC Chat</h2>
  <input id="nameInput" placeholder="输入你的昵称" maxlength="12">
  <button onclick="enterChat()">进入</button>
</div>

<header>
  <span class="dot"></span>
  <h1>nC Chat</h1>
  <span class="status" id="status">未连接</span>
</header>

<div id="messages"></div>

<footer>
  <input id="input" placeholder="说点什么..." onkeydown="if(event.key==='Enter')sendMsg()">
  <button id="send" onclick="sendMsg()">发送</button>
</footer>

<script>
let ws = null;
let myName = '';
const messagesDiv = document.getElementById('messages');
const statusDiv = document.getElementById('status');

function enterChat() {
  const name = document.getElementById('nameInput').value.trim();
  if (!name) return;
  myName = name;
  document.getElementById('login').style.display = 'none';
  connectWebSocket();
}

function connectWebSocket() {
  const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(protocol + '//' + location.host);

  ws.onopen = () => {
    statusDiv.textContent = '已连接';
    statusDiv.style.color = '#4caf50';
  };

  ws.onclose = () => {
    statusDiv.textContent = '连接断开';
    statusDiv.style.color = '#ef5350';
    setTimeout(connectWebSocket, 3000);
  };

  ws.onmessage = (event) => {
    const data = JSON.parse(event.data);
    if (data.type === 'history') {
      data.messages.forEach(m => addMessage(m, m.name === myName));
    } else if (data.type === 'chat') {
      addMessage(data.message, data.message.name === myName);
    }
  };
}

function addMessage(msg, isSelf) {
  const div = document.createElement('div');
  div.className = 'msg' + (isSelf ? ' self' : '');
  div.innerHTML = '<span class="name">' + escapeHtml(msg.name) + ' · ' + msg.time + '</span>' +
                  '<span class="text">' + escapeHtml(msg.text) + '</span>';
  messagesDiv.appendChild(div);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function sendMsg() {
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({ type: 'chat', name: myName, text: text }));
  input.value = '';
}
</script>

</body>
</html>
